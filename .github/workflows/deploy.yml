name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; let an in-progress deploy finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # required for OIDC role assumption
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # The bucket is shared with the other apps on nimblerendition.com, so
      # every sync — and every --delete it implies — stays inside this app's
      # own prefix. It must match the Vite `base`.
      #
      # Hashed assets are immutable — cache them hard. Upload everything
      # except the HTML entry points first.
      - name: Sync immutable assets
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/threadwell/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"

      # index.html (and any other HTML) must never be cached, so a deploy
      # is picked up immediately.
      - name: Sync HTML entry points
        run: |
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}/threadwell/" \
            --delete \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8" \
            --exclude "*" \
            --include "*.html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/threadwell/*"
